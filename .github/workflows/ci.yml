name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/logihero-ai-baseline-reconcile

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run typecheck
        run: npm run typecheck

      - name: Run secret scan
        run: npm run secret:scan

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android JVM tests
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace

      - name: Assemble Android debug build
        run: ./gradlew :app:assembleFullDebug --stacktrace
